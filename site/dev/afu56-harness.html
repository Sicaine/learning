<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/app.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<style>body{background:var(--bg,#fafafc)} #w{max-width:760px;margin:0 auto;padding:16px}</style></head>
<body><div id="w"><div id="stage" class="viz-stage"></div></div>
<script type="module">
const q = new URLSearchParams(location.search);
const root = document.documentElement; root.style.setProperty('--accent', '#047857'); root.style.setProperty('--accent-2', '#0ea5e9');
window.__done = 0;
const mod = await import(`../subjects/amateurfunk/viz/${q.get('viz')}.js`);
await mod.default(document.getElementById('stage'), { params: JSON.parse(q.get('p') || '{}'), ctx: {}, complete: () => { window.__done++; }, md: s => s });
window.__ready = true;
</script></body></html>
